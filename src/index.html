<body>
<main class="terminal" id="terminal" aria-label="plumthedev terminal">
    <header class="chrome">
        <div class="chrome__dots">
            <button type="button" class="dot dot--close" aria-label="close" data-action="close"></button>
            <button type="button" class="dot dot--min"   aria-label="minimize" data-action="min"></button>
            <button type="button" class="dot dot--max"   aria-label="maximize" data-action="max"></button>
        </div>
        <div class="chrome__path">root@plumthedev <span class="chrome__sep">—</span> ~</div>
        <div class="chrome__status"><span class="pulse"></span>online</div>
    </header>

    <section class="body" id="terminal-body" tabindex="-1">
        <div class="history" id="history"></div>

        <form class="prompt-line" id="prompt-form" autocomplete="off">
            <label for="terminal-input" class="prompt-line__prompt" aria-hidden="true">
                <span class="user">root</span><span class="at">@</span><span class="host">plumthedev</span>
                <span class="path">:~</span><span class="sigil">$</span>
            </label>
            <input
                id="terminal-input"
                class="prompt-line__input"
                type="text"
                autocomplete="off"
                autocorrect="off"
                autocapitalize="off"
                spellcheck="false"
                aria-label="terminal input"
            />
        </form>
    </section>

    <div class="closed-overlay" id="closed-overlay" hidden>
        <p>session closed.</p>
        <button type="button" class="closed-overlay__restore" id="restore">[ reconnect ]</button>
    </div>
</main>

<footer class="consent" id="cookies-banner" hidden>
    <span class="consent__label"><span class="hash">#</span> analytics: anonymous, helps me understand what reaches people.</span>
    <span class="consent__actions">
        <button type="button" id="accept-cookies" class="consent__btn consent__btn--accept">[ accept ]</button>
        <button type="button" id="reject-cookies" class="consent__btn consent__btn--reject">[ reject ]</button>

</footer>
